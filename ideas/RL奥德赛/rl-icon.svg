<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="#4F46E5" opacity="0.1"/>

  <!-- 主圆形边框 -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#4F46E5" stroke-width="3"/>

  <!-- 强化学习循环箭头 -->
  <!-- Agent (机器人头部) -->
  <g id="agent">
    <circle cx="100" cy="70" r="20" fill="#4F46E5"/>
    <circle cx="92" cy="65" r="3" fill="white"/>
    <circle cx="108" cy="65" r="3" fill="white"/>
    <path d="M 90 75 Q 100 80 110 75" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Action 箭头 (向下) -->
  <g id="action">
    <path d="M 100 95 L 100 115" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <polygon points="100,120 95,110 105,110" fill="#10B981"/>
    <text x="115" y="110" font-family="Arial, sans-serif" font-size="12" fill="#10B981" font-weight="bold">Action</text>
  </g>

  <!-- Environment (环境方块) -->
  <g id="environment">
    <rect x="75" y="125" width="50" height="30" rx="5" fill="#F59E0B" opacity="0.8"/>
    <text x="100" y="145" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Env</text>
  </g>

  <!-- Reward 箭头 (向左上) -->
  <g id="reward">
    <path d="M 75 135 Q 50 120 50 90" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <polygon points="50,85 47,95 53,95" fill="#EF4444"/>
    <text x="35" y="110" font-family="Arial, sans-serif" font-size="12" fill="#EF4444" font-weight="bold">R</text>
  </g>

  <!-- State 箭头 (向右上) -->
  <g id="state">
    <path d="M 125 135 Q 150 120 150 90" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="150,85 147,95 153,95" fill="#8B5CF6"/>
    <text x="155" y="110" font-family="Arial, sans-serif" font-size="12" fill="#8B5CF6" font-weight="bold">State</text>
  </g>

  <!-- 反馈箭头连接到 Agent -->
  <path d="M 50 85 Q 50 70 75 70" stroke="#EF4444" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 150 85 Q 150 70 125 70" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- RL 文字标识 -->
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="18" fill="#4F46E5" text-anchor="middle" font-weight="bold">RL</text>
</svg>
